<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cari Lagu & Pemutar Mirip</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; max-width: 500px; margin: 0 auto; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-bottom: 20px; }
    h2 { text-align: center; color: #38bdf8; margin-bottom: 15px; font-size: 1.4rem; }
    .search-box { display: flex; gap: 8px; margin-bottom: 15px; }
    input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; outline: none; }
    button { padding: 12px 16px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button:hover { background: #0284c7; color: #fff; }
    
    .results-list { max-height: 200px; overflow-y: auto; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
    .song-item { background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #334155; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .song-item:hover { border-color: #38bdf8; background: #1e293b; }
    .song-info { font-size: 0.9rem; }
    .song-title-text { font-weight: bold; color: #38bdf8; }
    .artist-text { color: #94a3b8; font-size: 0.8rem; }
    
    .player-box { background: #0f172a; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #334155; display: none; }
    audio { width: 100%; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🔍 Cari Lagu Mirip Kata</h2>
    
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Ketik beberapa kata lirik..." onkeypress="if(event.key==='Enter') searchSongs()">
      <button onclick="searchSongs()">Cari</button>
    </div>

    <!-- Daftar Hasil Lagu yang Mirip -->
    <div class="results-list" id="resultsList"></div>

    <!-- Pemutar Lagu yang Dipilih -->
    <div class="player-box" id="playerBox">
      <div id="nowPlayingTitle" class="song-title-text"></div>
      <div id="nowPlayingArtist" class="artist-text"></div>
      <audio id="audioPlayer" controls autoplay></audio>
    </div>
  </div>

  <script>
    async function searchSongs() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return alert("Masukkan beberapa kata terlebih dahulu!");

      const resultsList = document.getElementById('resultsList');
      resultsList.innerHTML = "<div style='text-align:center; color:#94a3b8;'>Mencari lagu mirip...</div>";

      try {
        const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&limit=5&entity=song`);
        const data = await response.json();

        resultsList.innerHTML = "";

        if (data.results.length === 0) {
          resultsList.innerHTML = "<div style='text-align:center; color:#94a3b8;'>Lagu mirip tidak ditemukan.</div>";
          return;
        }

        data.results.forEach(track => {
          const item = document.createElement('div');
          item.className = 'song-item';
          item.innerHTML = `
            <div class="song-info">
              <div class="song-title-text">${track.trackName}</div>
              <div class="artist-text">${track.artistName}</div>
            </div>
            <button style="padding:6px 10px; font-size:0.8rem;" onclick="playTrack('${track.previewUrl}', '${escapeQuotes(track.trackName)}', '${escapeQuotes(track.artistName)}')">Setel</button>
          `;
          resultsList.appendChild(item);
        });

      } catch (err) {
        resultsList.innerHTML = "<div style='text-align:center; color:#ef4444;'>Gagal mencari lagu.</div>";
      }
    }

    function playTrack(url, title, artist) {
      const playerBox = document.getElementById('playerBox');
      const audioPlayer = document.getElementById('audioPlayer');
      
      document.getElementById('nowPlayingTitle').innerText = title;
      document.getElementById('nowPlayingArtist').innerText = artist;
      
      audioPlayer.src = url;
      playerBox.style.display = 'block';
      audioPlayer.play();
    }

    function escapeQuotes(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
    }
  </script>

</body>
</html>

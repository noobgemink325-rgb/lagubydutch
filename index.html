<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cari Musik & Lirik</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; max-width: 600px; margin: 30px auto; padding: 20px; }
    h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
    .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 1rem; }
    button { padding: 12px 20px; background-color: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #0284c7; color: white; }
    .player-container { margin-bottom: 20px; border-radius: 12px; overflow: hidden; background: #1e293b; text-align: center; display: none; }
    iframe { width: 100%; height: 210px; border: none; }
    .lyrics-box { background: #1e293b; padding: 20px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; text-align: center; display: none; }
    .btn-search-lyrics { display: inline-block; margin-top: 15px; padding: 10px 15px; background: #10b981; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; }
  </style>
</head>
<body>

  <h2>🎵 Pemutar Musik & Lirik</h2>
  
  <div class="search-box">
    <input type="text" id="songInput" placeholder="Masukkan judul lagu & penyanyi...">
    <button onclick="playSong()">Cari & Putar</button>
  </div>

  <div class="player-container" id="playerContainer">
    <iframe id="youtubePlayer" allow="autoplay"></iframe>
  </div>

  <div class="lyrics-box" id="lyricsBox">
    <h3 id="songTitle"></h3>
    <p id="lyricsNotice"></p>
    <a id="googleSearchBtn" class="btn-search-lyrics" target="_blank">Lihat Lirik Lengkap di Google</a>
  </div>

  <script>
    function playSong() {
      const input = document.getElementById('songInput').value.trim();
      if (!input) {
        alert("Masukkan judul lagu terlebih dahulu!");
        return;
      }

      // Tampilkan Pemutar Musik (YouTube Embed Search)
      const playerContainer = document.getElementById('playerContainer');
      const player = document.getElementById('youtubePlayer');
      player.src = `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(input)}&autoplay=1`;
      playerContainer.style.display = 'block';

      // Tampilkan Bagian Informasi Lirik
      const lyricsBox = document.getElementById('lyricsBox');
      const songTitle = document.getElementById('songTitle');
      const lyricsNotice = document.getElementById('lyricsNotice');
      const googleSearchBtn = document.getElementById('googleSearchBtn');

      songTitle.innerText = `Menampilkan Lirik untuk: "${input}"`;
      lyricsNotice.innerText = "Untuk alasan hak cipta, lirik lagu lengkap dapat dibuka melalui lisensi resmi Google Search.";
      
      // Link ke Pencarian Google Lirik Resmi
      googleSearchBtn.href = `https://www.google.com/search?q=${encodeURIComponent(input + " lirik")}`;
      lyricsBox.style.display = 'block';
    }
  </script>

</body>
</html>

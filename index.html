<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemutar Musik & Lirik</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; max-width: 600px; margin: 30px auto; padding: 20px; }
    h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
    .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 1rem; }
    button { padding: 12px 20px; background-color: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #0284c7; color: white; }
    .player-container { margin-bottom: 20px; border-radius: 12px; overflow: hidden; background: #1e293b; text-align: center; display: none; padding: 10px; }
    iframe { width: 100%; height: 250px; border: none; border-radius: 8px; }
    .lyrics-box { background: #1e293b; padding: 20px; border-radius: 12px; line-height: 1.6; text-align: center; display: none; margin-top: 15px; }
    .btn-action { display: inline-block; margin: 8px 5px; padding: 10px 15px; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 0.9rem; }
    .btn-youtube { background: #ef4444; }
    .btn-lyrics { background: #10b981; }
  </style>
</head>
<body>

  <h2>🎵 Pemutar Musik & Lirik</h2>
  
  <div class="search-box">
    <input type="text" id="songInput" placeholder="Masukkan judul lagu & penyanyi...">
    <button onclick="playSong()">Cari & Putar</button>
  </div>

  <div class="player-container" id="playerContainer">
    <iframe id="youtubePlayer" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>

  <div class="lyrics-box" id="lyricsBox">
    <h3 id="songTitle" style="color: #38bdf8; margin-top:0;"></h3>
    <p id="lyricsNotice">Putar musik melalui tombol atau pemutar di atas, lalu cek lirik di bawah ini:</p>
    <div>
      <a id="ytDirectBtn" class="btn-action btn-youtube" target="_blank">▶ Putar Langsung di YouTube</a>
      <a id="googleSearchBtn" class="btn-action btn-lyrics" target="_blank">📄 Buka Lirik di Google</a>
    </div>
  </div>

  <script>
    function playSong() {
      const input = document.getElementById('songInput').value.trim();
      if (!input) {
        alert("Masukkan judul lagu terlebih dahulu!");
        return;
      }

      const encodedQuery = encodeURIComponent(input);

      // Menggunakan YouTube No-Cookie / Embed Kueri yang Kompatibel
      const playerContainer = document.getElementById('playerContainer');
      const player = document.getElementById('youtubePlayer');
      player.src = `https://www.youtube-nocookie.com/embed?listType=search&list=${encodedQuery}`;
      playerContainer.style.display = 'block';

      // Update Tampilan Lirik dan Link Direct
      const lyricsBox = document.getElementById('lyricsBox');
      const songTitle = document.getElementById('songTitle');
      const googleSearchBtn = document.getElementById('googleSearchBtn');
      const ytDirectBtn = document.getElementById('ytDirectBtn');

      songTitle.innerText = `Lagu: "${input}"`;
      
      // Tombol Alternatif jika Embed Diblokir oleh YouTube
      ytDirectBtn.href = `https://www.youtube.com/results?search_query=${encodedQuery}`;
      googleSearchBtn.href = `https://www.google.com/search?q=${encodeURIComponent(input + " lirik")}`;
      
      lyricsBox.style.display = 'block';
    }
  </script>

</body>
</html>
